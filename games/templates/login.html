{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login | Game Store</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background: #f1f1f1;
            font-family: Arial, sans-serif;
            color: #222;
        }

        .card {
            width: 100%;
            max-width: 400px;
            background: white;
            border-radius: 12px;
            padding: 32px;
            box-shadow: 0 8px 30px #00000012;
        }

        .logo {
            display: block;
            max-width: 100%;
            width: 220px;
            max-height: 100px;
            object-fit: contain;
            margin: 0 auto 18px;
        }

        h1 {
            text-align: center;
            font-size: 25px;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 28px;
        }

        label {
            display: block;
            font-weight: bold;
            margin: 16px 0 7px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        input:focus {
            outline: 2px solid #e60012;
            border-color: #e60012;
        }

        button {
            width: 100%;
            margin-top: 24px;
            padding: 13px;
            border: none;
            border-radius: 6px;
            background: #e60012;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover { background: #c90010; }

        .links {
            text-align: center;
            margin-top: 22px;
            font-size: 14px;
        }

        a {
            color: #d40010;
            font-weight: bold;
            text-decoration: none;
        }

        .message {
            padding: 10px;
            background: #fff0f0;
            border-radius: 6px;
            color: #a00000;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <main class="card">
        <img class="logo" src="{% static 'games/images/logo_white.png' %}"
             alt="Game Store logo">

        <h1>Welcome back</h1>
        <p class="subtitle">Log in to your game store account.</p>

        {% for message in messages %}
            <p class="message">{{ message }}</p>
        {% endfor %}

        <form method="post">
            {% csrf_token %}

            <label for="username">Username</label>
            <input id="username" name="username"
                   type="text" autocomplete="username"
                   maxlength="150" required>

            <label for="password">Password</label>
            <input id="password" name="password"
                   type="password" autocomplete="current-password"
                   required>

            <button type="submit">LOG IN</button>
        </form>

        <div class="links">
            New player?
            <a href="{% url 'signup' %}">Create an account</a>
        </div>
    </main>
</body>
</html>
